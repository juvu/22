                                                <span className="text-gray-400">Current High Bid</span>
                                                <span className="font-mono font-bold text-xl">$52,000</span>
                                            </div>
                                            <div className="flex justify-between items-center text-sm">
                                                <span className="text-gray-400">Reserve Price</span>
                                                <span className="text-green-400 flex items-center gap-1">
                                                    <ShieldCheck size={14} /> Met
                                                </span>
                                            </div>
                                            <div className="flex justify-between items-center text-sm">
                                                <span className="text-gray-400">Active Bidders</span>
                                                <span className="flex items-center gap-1">
                                                    <User size={14} /> 14
                                                </span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Right: Bid Form */}
                                    <div className="bg-white/5 rounded-2xl p-6 border border-white/5">
                                        <form onSubmit={handleSubmitBid} className="space-y-6">
                                            <div>
                                                <label className="block text-xs uppercase text-gray-500 font-bold mb-2">Your Offer (USD)</label>
                                                <div className="relative">
                                                    <span className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">$</span>
                                                    <input 
                                                        type="number" 
                                                        min="52500"
                                                        step="100"
                                                        value={bidAmount}
                                                        onChange={(e) => setBidAmount(e.target.value)}
                                                        className="w-full bg-black/50 border border-white/10 rounded-xl py-4 pl-8 pr-4 text-white placeholder-gray-600 focus:outline-none focus:border-brand-accent transition-colors font-mono"
                                                        placeholder="55,000"
                                                    />
                                                </div>
                                                <div className="mt-2 text-xs text-gray-500">Min. increment: $500</div>
                                            </div>

                                            <button type="submit" className="w-full py-4 bg-brand-accent hover:bg-brand-accent/90 text-white font-bold rounded-xl transition-all shadow-lg shadow-brand-accent/20">
                                                Confirm Bid
                                            </button>
                                            
                                            <div className="text-center text-xs text-gray-500">
                                                By placing a bid, you agree to the <a href="#" className="underline hover:text-white">Auction Terms</a>.
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const Footer = () => {
            return (
                <footer id="footer" className="bg-black py-12 border-t border-white/5">
                    <div className="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-6">
                        <div className="text-2xl font-mono font-bold text-gray-600 hover:text-white transition-colors">
                            2².ai
                        </div>
                        
                        <div className="flex gap-8 text-sm text-gray-500">
                            <a href="#" className="hover:text-brand-accent transition-colors">Privacy</a>
                            <a href="#" className="hover:text-brand-accent transition-colors">Terms</a>
                            <a href="#" className="hover:text-brand-accent transition-colors">Escrow</a>
                        </div>

                        <div className="text-sm text-gray-600">
                            &copy; 2025 Exponential Assets Ltd.
                        </div>
                    </div>
                </footer>
            );
        };

        const App = () => {
          return (
            <div className="bg-brand-dark min-h-screen text-white font-sans selection:bg-brand-accent selection:text-white">
                <Header />
                <main>
                    <Hero />
                    <Features />
                    <MarketData />
                    <Auction />
                </main>
                <Footer />
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
