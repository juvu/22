<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22.ai | The Master Number</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@100;400;900&family=Cinzel:wght@400;700&family=Space+Mono:wght@400;700&display=swap');

        :root {
            --bg-color: #080808;
            --text-color: #e5e5e5;
            --accent-color: #333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Space Mono', monospace; /* 基础字体：数据感 */
            overflow: hidden;
            transition: all 0.5s ease;
        }

        /* 巨型主标题 */
        .master-number {
            font-family: 'Archivo', sans-serif;
            font-weight: 900;
            letter-spacing: -0.05em;
            line-height: 0.8;
            background: linear-gradient(180deg, #fff 0%, #666 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.95;
        }

        /* 副标题风格：根据季度变化 */
        .subtitle-text {
            font-family: 'Cinzel', serif; /* 罗马碑文感 */
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-size: 0.8rem;
            opacity: 0; /* 初始隐藏，JS淡入 */
            transform: translateY(10px);
            transition: all 1s ease;
        }

        .subtitle-visible {
            opacity: 0.6;
            transform: translateY(0);
        }

        /* Q4 的光标闪烁 */
        .cursor-blink {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: #fff;
            animation: blink 1s step-end infinite;
            vertical-align: bottom;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 第一层暗示：页脚年份 */
        .footer-hint {
            font-size: 10px;
            color: #333;
            letter-spacing: 0.05em;
            transition: color 0.5s;
        }
        .footer-hint:hover {
            color: #666; /* 鼠标放上去才稍微亮一点 */
        }

        /* 隐形交互区域 */
        .inquiry-btn {
            position: absolute;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.5s;
            cursor: pointer;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .inquiry-btn:hover {
            opacity: 1;
            background: rgba(255,255,255,0.02);
        }

    </style>
</head>
<body class="h-screen flex flex-col justify-center items-center relative select-none">

    <!-- 调试开关 (实际部署时可删除，或保留给自己测试) -->
    <div class="absolute top-4 right-4 flex gap-2 opacity-10 hover:opacity-100 transition-opacity z-50">
        <button onclick="setQuarter(1)" class="text-xs border p-1">Q1</button>
        <button onclick="setQuarter(2)" class="text-xs border p-1">Q2</button>
        <button onclick="setQuarter(3)" class="text-xs border p-1">Q3</button>
        <button onclick="setQuarter(4)" class="text-xs border p-1">Q4</button>
    </div>

    <!-- 核心视觉 -->
    <main class="text-center z-10 relative">
        <h1 class="text-[12rem] md:text-[20rem] master-number relative">
            22<span class="text-2xl md:text-4xl absolute top-10 right-[-2rem] font-light tracking-widest text-gray-600">.ai</span>
        </h1>

        <!-- 第二层：季度轮换副标题 -->
        <div id="dynamic-subtitle" class="subtitle-text mt-8 h-8">
            <!-- JS Will Inject Content Here -->
        </div>

        <!-- 第三层：隐形询盘通道 -->
        <!-- 只有鼠标悬停在特定区域，才会显现出极简的联系方式 -->
        <a id="contact-link" href="mailto:bridge@22.ai" class="inquiry-btn text-xs tracking-[0.3em] text-gray-500 uppercase">
            Inquire Asset
        </a>
    </main>

    <!-- 第一层：视觉植入 (年度彩蛋) -->
    <footer class="absolute bottom-6 w-full text-center">
        <div class="footer-hint">
            Est. 2026 <span class="mx-1 opacity-50">—</span> 22nd Century
        </div>
    </footer>

    <script>
        // 核心逻辑：获取当前时间并设置状态
        function initTimeline() {
            const now = new Date();
            const month = now.getMonth() + 1; // 1-12
            
            let quarter = 1;
            if (month >= 4 && month <= 6) quarter = 2;
            else if (month >= 7 && month <= 9) quarter = 3;
            else if (month >= 10) quarter = 4;

            setQuarter(quarter);
        }

        function setQuarter(q) {
            const subtitleEl = document.getElementById('dynamic-subtitle');
            const linkEl = document.getElementById('contact-link');
            
            // 重置动画
            subtitleEl.classList.remove('subtitle-visible');
            
            setTimeout(() => {
                // 内容与通道轮换逻辑
                switch(q) {
                    case 1: // Q1: 金融科技月 (Squared)
                        subtitleEl.innerHTML = 'S Q U A R E D';
                        linkEl.href = "mailto:squared@22.ai?subject=Alpha Protocol Inquiry";
                        subtitleEl.style.color = "#a3a3a3"; // 银灰色
                        break;
                        
                    case 2: // Q2: 灵性科技月 (Master Builder)
                        subtitleEl.innerHTML = 'M A S T E R &nbsp; B U I L D E R';
                        linkEl.href = "mailto:bridge@22.ai?subject=Architecture Inquiry";
                        subtitleEl.style.color = "#d4af37"; // 暗金色
                        break;
                        
                    case 3: // Q3: 未来主义月 (Century)
                        subtitleEl.innerHTML = 'C E N T U R Y';
                        // 只有 Q3 开启顶级通道
                        linkEl.href = "mailto:century@22.ai?subject=Centennial Acquisition"; 
                        subtitleEl.style.color = "#ffffff"; // 纯白，极致高亮
                        break;
                        
                    case 4: // Q4: 留白 (买家填空)
                        subtitleEl.innerHTML = '<span class="cursor-blink"></span>';
                        linkEl.href = "mailto:bridge@22.ai?subject=Undefined Future";
                        break;
                }
                
                // 触发淡入
                subtitleEl.classList.add('subtitle-visible');
            }, 300);
        }

        // 初始化
        window.onload = initTimeline;
    </script>
</body>
</html>
