<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22.ai | The Underlying Order</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Cormorant+Garamond:ital,wght@1,400&display=swap');

        :root {
            --bg-color: #030304; /* 接近绝对黑的深灰 */
            --text-primary: #e5e5e5;
            --grid-color: rgba(255, 255, 255, 0.03); /* 极淡的灰线 3% 透明度 */
            --node-color: rgba(255, 255, 255, 0.08);
            --highlight-color: rgba(255, 255, 255, 0.4);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            margin: 0;
            cursor: crosshair; /* 十字准星鼠标，强化精确感 */
        }

        /* 背景 Canvas */
        #math-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none; /* 让鼠标事件穿透到 body */
        }

        /* 主标题 */
        .title-glitch {
            font-size: clamp(6rem, 20vw, 16rem);
            font-weight: 700;
            line-height: 0.8;
            letter-spacing: -0.05em;
            background: linear-gradient(180deg, #fff 20%, #444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.95;
            z-index: 10;
        }

        /* 极简副标题容器 */
        .subtitle-container {
            height: 2rem;
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .subtitle-text {
            font-family: 'Cormorant Garamond', serif; /* 衬线体带来数学论文的质感 */
            font-style: italic;
            font-size: 1.2rem;
            letter-spacing: 0.1em;
            color: #666;
            opacity: 0;
            transform: translateY(10px);
            transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .subtitle-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 隐形询盘层 */
        .ghost-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* 默认不挡鼠标 */
        }

        .inquiry-trigger {
            pointer-events: auto; /* 只有这块区域接受鼠标 */
            padding: 40px;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .inquiry-trigger:hover {
            opacity: 1;
        }

        .inquiry-btn {
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            padding: 12px 24px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #888;
        }
        .inquiry-btn:hover {
            color: #fff;
            border-color: #fff;
        }

        /* 22nd Century 暗示 */
        .century-hint {
            position: absolute;
            bottom: 2rem;
            width: 100%;
            text-align: center;
            font-size: 0.65rem;
            color: #222; /* 极暗，几乎看不见 */
            letter-spacing: 0.05em;
            font-family: monospace;
            transition: color 0.8s;
            z-index: 10;
        }
        .century-hint:hover {
            color: #555;
        }

    </style>
</head>
<body>

    <!-- 背景：数学网格 -->
    <canvas id="math-grid"></canvas>

    <!-- 核心内容 -->
    <main class="h-screen flex flex-col justify-center items-center relative z-10">
        <!-- 22.ai -->
        <h1 class="title-glitch select-none">22<span class="text-3xl font-light text-gray-700 align-top opacity-50">.ai</span></h1>

        <!-- 季度轮换副标题 -->
        <div class="subtitle-container">
            <div id="dynamic-subtitle" class="subtitle-text">
                <!-- JS 注入 -->
            </div>
        </div>

        <!-- 隐形触发层 -->
        <div class="ghost-layer">
            <!-- 只有鼠标悬停在屏幕正中心下方时，才会显示 -->
            <div class="inquiry-trigger mt-64">
                <a id="contact-link" href="#" class="inquiry-btn">
                    Inquire Asset
                </a>
            </div>
        </div>
    </main>

    <!-- 底部暗示 -->
    <div class="century-hint">
        Est. 2026 &nbsp;&bull;&nbsp; 22nd Century Infrastructure
    </div>

    <!-- 逻辑脚本 -->
    <script>
        /**
         * 1. 视觉逻辑：绘制极淡的二项式展开 (帕斯卡三角) 网格
         */
        const canvas = document.getElementById('math-grid');
        const ctx = canvas.getContext('2d');
        let width, height;
        let mouseX = -1000, mouseY = -1000;

        // 节点配置
        const rows = 12; // 三角形的层数
        const nodeRadius = 2; 
        const spacingY = 60; // 层距
        
        let nodes = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initNodes();
        }

        function initNodes() {
            nodes = [];
            // 从屏幕中心偏上开始绘制
            const startX = width / 2;
            const startY = height / 2 - (rows * spacingY) / 2;

            for (let i = 0; i < rows; i++) {
                // 每一层的节点数 = i + 1
                // 每一层的宽度 = i * spacingX
                // 二项式分布会让底部变宽
                const spacingX = width / (rows + 2) * 1.5; // 动态宽度
                
                for (let j = 0; j <= i; j++) {
                    const x = startX - (i * spacingX) / 2 + j * spacingX;
                    const y = startY + i * spacingY;
                    
                    // 父节点索引 (用于连线)
                    let parents = [];
                    if (i > 0) {
                        // 寻找上一层的邻居
                        // 这是一个简化的视觉连线，不是严格的算法
                        // 上一层中心点 x_prev = startX - ((i-1)*spacingX)/2 + k*spacingX
                        // 简单几何连线即可
                    }

                    nodes.push({ x, y, r: i, c: j });
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            // 1. 绘制连线 (二项式路径)
            ctx.lineWidth = 1;
            
            nodes.forEach((node, index) => {
                // 计算与鼠标的距离，产生高亮
                const dist = Math.hypot(node.x - mouseX, node.y - mouseY);
                const isHover = dist < 150;
                
                // 基础透明度 0.03，高亮时 0.2
                const alpha = isHover ? 0.2 : 0.03;
                
                // 找下一层的“孩子”进行连线
                // 简单的视觉逻辑：连向下一层的左下和右下
                const nextRowNodes = nodes.filter(n => n.r === node.r + 1);
                nextRowNodes.forEach(child => {
                    // 如果横向距离合适，就认为是孩子
                    if (Math.abs(child.x - node.x) < width / (rows + 2)) {
                        ctx.beginPath();
                        ctx.moveTo(node.x, node.y);
                        ctx.lineTo(child.x, child.y);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                        ctx.stroke();
                    }
                });

                // 2. 绘制节点
                ctx.beginPath();
                ctx.arc(node.x, node.y, nodeRadius, 0, Math.PI * 2);
                ctx.fillStyle = isHover ? `rgba(255,255,255,0.6)` : `rgba(255,255,255,0.08)`;
                ctx.fill();
            });

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // 初始化 Canvas
        resize();
        draw();

        /**
         * 2. 业务逻辑：季度轮换与邮箱分层
         */
        function initBusinessLogic() {
            const now = new Date();
            const month = now.getMonth() + 1;
            let quarter = Math.ceil(month / 3);

            const subEl = document.getElementById('dynamic-subtitle');
            const linkEl = document.getElementById('contact-link');

            // 定义不同季度的配置
            // Q1: Squared (数学/金融) - 西方金融叙事
            // Q2: Master Builder (建筑/灵性) - 22的大师数含义
            // Q3: Century (时间/未来) - 22世纪叙事
            // Q4: [Void] - 留白
            
            const configs = {
                1: { 
                    text: '( a + b )²', 
                    email: 'squared@22.ai', 
                    subject: 'Quantitative Asset Inquiry' 
                },
                2: { 
                    text: 'The Master Builder', 
                    email: 'bridge@22.ai', 
                    subject: 'Strategic Infrastructure Inquiry' 
                },
                3: { 
                    text: 'C E N T U R Y', 
                    email: 'century@22.ai', 
                    subject: 'Centennial Acquisition' // 顶级触发词
                },
                4: { 
                    text: '_', 
                    email: 'hello@22.ai', 
                    subject: 'Undefined Future' 
                }
            };

            const current =  configs[1]; // 默认Q1

            // 渲染内容
            subEl.innerText = current.text;
            linkEl.href = `mailto:${current.email}?subject=${current.subject}`;

            // 延迟淡入动画
            setTimeout(() => {
                subEl.classList.add('subtitle-visible');
            }, 500);
        }

        initBusinessLogic();

    </script>
</body>
</html>
