<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22.ai | The Underlying Order</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Cormorant+Garamond:ital,wght@1,400&display=swap');

        :root {
            --bg-color: #030304;
            --text-primary: #e5e5e5;
            --grid-idle: rgba(255, 255, 255, 0.02);
            --grid-active: rgba(255, 255, 255, 0.15);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            margin: 0;
            cursor: crosshair;
        }

        /* 背景 Canvas */
        #math-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* 主标题 - 增加排版细节暗示 2 的平方 */
        .title-glitch {
            font-size: clamp(6rem, 20vw, 16rem);
            font-weight: 700;
            line-height: 0.8;
            letter-spacing: -0.05em;
            background: linear-gradient(180deg, #fff 20%, #444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.95;
            z-index: 10;
            position: relative;
        }

        /* 极简副标题容器 */
        .subtitle-container {
            height: 2rem;
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .subtitle-text {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.2rem;
            letter-spacing: 0.1em;
            color: #666;
            opacity: 0;
            transform: translateY(10px);
            transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .subtitle-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 隐形询盘层 */
        .ghost-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .inquiry-trigger {
            pointer-events: auto;
            padding: 40px;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .inquiry-trigger:hover {
            opacity: 1;
        }

        .inquiry-btn {
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            padding: 12px 24px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #888;
            text-decoration: none;
            transition: all 0.3s;
        }
        .inquiry-btn:hover {
            color: #fff;
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }

        /* 底部暗示 */
        .century-hint {
            position: absolute;
            bottom: 2rem;
            width: 100%;
            text-align: center;
            font-size: 0.65rem;
            color: #222;
            letter-spacing: 0.05em;
            font-family: monospace;
            transition: color 0.8s;
            z-index: 10;
        }
        .century-hint:hover {
            color: #555;
        }

    </style>
</head>
<body>

    <!-- 矩阵网络背景 -->
    <canvas id="math-grid"></canvas>

    <!-- 核心内容 -->
    <main class="h-screen flex flex-col justify-center items-center relative z-10">
        <!-- 22.ai / 视觉上可解读为 2².ai -->
        <h1 class="title-glitch select-none">22<span class="text-3xl font-light text-gray-700 align-top opacity-50">.ai</span></h1>

        <!-- 动态副标题 -->
        <div class="subtitle-container">
            <div id="dynamic-subtitle" class="subtitle-text">
                <!-- JS 注入 -->
            </div>
        </div>

        <!-- 隐形触发层 -->
        <div class="ghost-layer">
            <div class="inquiry-trigger mt-64">
                <a id="contact-link" href="#" class="inquiry-btn">
                    Initialize Tensor
                </a>
            </div>
        </div>
    </main>

    <!-- 底部标识 -->
    <div class="century-hint">
        Quadratic Complexity &nbsp;&bull;&nbsp; O(N²) Infrastructure
    </div>

    <!-- 逻辑脚本 -->
    <script>
        /**
         * 1. 视觉逻辑：矩阵相乘 (Matrix Multiplication)
         * 模拟 C(i,j) = Row(i) * Col(j) 的点积过程
         */
        const canvas = document.getElementById('math-grid');
        const ctx = canvas.getContext('2d');
        let width, height;
        let mouseX = -1000, mouseY = -1000;

        const spacing = 60; // 矩阵单元格大小
        let cols, rows;
        let offsetX, offsetY;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            
            cols = Math.floor(width / spacing);
            rows = Math.floor(height / spacing);
            
            // 居中偏移量
            offsetX = (width - cols * spacing) / 2;
            offsetY = (height - rows * spacing) / 2;
        }

        // 动画时间戳（用于数据流动画）
        let time = 0;

        function draw() {
            ctx.clearRect(0, 0, width, height);
            time += 0.02;

            // 寻找离鼠标最近的行与列（模拟激活的 Matrix C_{i,j} 节点）
            let activeCol = -1;
            let activeRow = -1;
            
            // 只有当鼠标在屏幕内时才激活
            if (mouseX > 0 && mouseX < width && mouseY > 0 && mouseY < height) {
                activeCol = Math.round((mouseX - offsetX) / spacing);
                activeRow = Math.round((mouseY - offsetY) / spacing);
                
                // 边界限制
                if (activeCol < 0) activeCol = 0;
                if (activeCol > cols) activeCol = cols;
                if (activeRow < 0) activeRow = 0;
                if (activeRow > rows) activeRow = rows;
            }

            // --- 绘制矩阵的行 (Matrix A 的横向向量) ---
            for(let r = 0; r <= rows; r++) {
                const y = offsetY + r * spacing;
                const isActive = (r === activeRow);
                
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.strokeStyle = isActive ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.02)';
                ctx.lineWidth = isActive ? 1.5 : 1;
                ctx.stroke();

                // 如果是激活行，绘制数据流 (流向交点)
                if (isActive && activeCol !== -1) {
                    const targetX = offsetX + activeCol * spacing;
                    const flowX = (time * 200) % width; // 循环流动
                    if (flowX < targetX) { // 汇聚到交点前
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                        ctx.fillRect(flowX, y - 1, 10, 2);
                    }
                }
            }

            // --- 绘制矩阵的列 (Matrix B 的纵向向量) ---
            for(let c = 0; c <= cols; c++) {
                const x = offsetX + c * spacing;
                const isActive = (c === activeCol);
                
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.strokeStyle = isActive ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.02)';
                ctx.lineWidth = isActive ? 1.5 : 1;
                ctx.stroke();

                // 如果是激活列，绘制数据流 (流向交点)
                if (isActive && activeRow !== -1) {
                    const targetY = offsetY + activeRow * spacing;
                    const flowY = (time * 200) % height;
                    if (flowY < targetY) {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                        ctx.fillRect(x - 1, flowY, 2, 10);
                    }
                }
            }

            // --- 绘制交汇节点 (Dot Product Result) ---
            for (let c = 0; c <= cols; c++) {
                for (let r = 0; r <= rows; r++) {
                    const x = offsetX + c * spacing;
                    const y = offsetY + r * spacing;
                    
                    const isCenter = (c === activeCol && r === activeRow);
                    const isAxis = (c === activeCol || r === activeRow);
                    
                    ctx.beginPath();
                    if (isCenter) {
                        // 核心计算节点 C_{i,j}
                        ctx.arc(x, y, 4, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255,255,255,0.9)';
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = 'rgba(255,255,255,0.5)';
                        
                        // 绘制矩阵数学符号暗示
                        ctx.font = '10px monospace';
                        ctx.fillStyle = 'rgba(255,255,255,0.5)';
                        ctx.fillText(`C(${r},${c})`, x + 10, y - 10);
                        
                    } else if (isAxis) {
                        // 参与点积运算的向量节点
                        ctx.arc(x, y, 2, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255,255,255,0.3)';
                        ctx.shadowBlur = 0;
                    } else {
                        // 沉寂节点
                        ctx.arc(x, y, 1, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255,255,255,0.05)';
                        ctx.shadowBlur = 0;
                    }
                    ctx.fill();
                }
            }

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        window.addEventListener('mouseout', () => {
            // 鼠标移出屏幕时重置
            mouseX = -1000;
            mouseY = -1000;
        });

        // 初始化 Canvas
        resize();
        draw();

        /**
         * 2. 业务逻辑：季度轮换与邮箱分层 (矩阵/算力主题)
         */
        function initBusinessLogic() {
            const subEl = document.getElementById('dynamic-subtitle');
            const linkEl = document.getElementById('contact-link');

            // 定义不同季度的配置 (契合二次方和矩阵运算的叙事)
            const configs = {
                1: { 
                    text: 'O ( N² )',  // 代表二次方时间复杂度
                    email: 'contact@22.ai', 
                    subject: 'Quadratic Asset Inquiry' 
                },
                2: { 
                    text: 'A × B = C', // 代表矩阵相乘
                    email: 'matrix@22.ai', 
                    subject: 'Matrix Logic Inquiry' 
                },
                3: { 
                    text: 'T E N S O R', // 代表高维矩阵运算
                    email: 'tensor@22.ai', 
                    subject: 'Tensor Core Acquisition' 
                },
                4: { 
                    text: 'Exponential Growth', // 代表指数级跃迁
                    email: 'hello@22.ai', 
                    subject: 'Exponential Infrastructure' 
                }
            };

            const current = configs[1]; // 默认使用 Q1 的配置

            // 渲染内容
            subEl.innerText = current.text;
            linkEl.href = `mailto:${current.email}?subject=${current.subject}`;

            // 延迟淡入动画
            setTimeout(() => {
                subEl.classList.add('subtitle-visible');
            }, 500);
        }

        initBusinessLogic();

    </script>
</body>
</html>
